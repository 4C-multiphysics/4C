name: macOS built test

on:
  schedule:
    - cron: 3 4 * * 0
      timezone: "Europe/Berlin"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 4C on macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: System preparation
        run: ./dependencies/darwin/prepare_system.sh
      - name: Get Homebrew versions
        id: brew-versions
        run: |
          # Generate a key of all brew libraries
          echo "hash=$(brew list --versions | sha256sum | awk '{print $1}')" >> $GITHUB_OUTPUT
      - name: Restore dependencies cache
        id: cache-deps
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.HOME }}/opt
          key: ${{ runner.os }}-deps-${{ hashFiles('./dependencies/darwin/compile_dependencies.sh', 'dependencies/darwin/**/install.sh',
            'dependencies/current/**/install.sh') }}-brew-${{ steps.brew-versions.outputs.hash }}
      - name: Compile and install the dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          echo "install the dependencies"
          cmake --version
          ./dependencies/darwin/compile_dependencies.sh
      - name: Save dependencies cache
        if: success() && steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.HOME }}/opt
          key: ${{ runner.os }}-deps-${{ hashFiles('./dependencies/darwin/compile_dependencies.sh', 'dependencies/darwin/**/install.sh',
            'dependencies/current/**/install.sh') }}-brew-${{ steps.brew-versions.outputs.hash }}
      - name: Restore build cache
        id: cache-build
        uses: actions/cache/restore@v6
        with:
          path: build/
          key: ${{ runner.os }}-build-${{ github.sha }}-brew-${{ steps.brew-versions.outputs.hash }}
      - name: Build 4C
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: |
          pwd
          g++ -v
          cmake -B build/ --fresh --preset=darwin
          cmake --build build/ --target full
      - name: Save build cache
        if: success() && steps.cache-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/
          key: ${{ runner.os }}-build-${{ github.sha }}-brew-${{ steps.brew-versions.outputs.hash }}

  test:
    name: Test 4C on macOS
    needs: build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: System preparation
        run: ./dependencies/darwin/prepare_system.sh
      - name: Get Homebrew versions
        id: brew-versions
        run: |
          # Generate a key of all brew libraries
          echo "hash=$(brew list --versions | sha256sum | awk '{print $1}')" >> $GITHUB_OUTPUT
      - name: Restore dependencies cache
        id: cache-deps
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.HOME }}/opt
          key: ${{ runner.os }}-deps-${{ hashFiles('./dependencies/darwin/compile_dependencies.sh', 'dependencies/darwin/**/install.sh',
            'dependencies/current/**/install.sh') }}-brew-${{ steps.brew-versions.outputs.hash }}
      - name: Restore build cache
        id: cache-build
        uses: actions/cache/restore@v6
        with:
          path: build/
          key: ${{ runner.os }}-build-${{ github.sha }}-brew-${{ steps.brew-versions.outputs.hash }}
      - name: Run tests
        run: |
          echo "tests"
          ctest  --test-dir build/ -j `sysctl -n hw.physicalcpu` --output-on-failure --output-junit $GITHUB_WORKSPACE/macos_assertions_test_report.xml
      - name: Upload test report
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos_assertions_test_report.xml
          path: |
            ${{ github.workspace }}/macos_assertions_test_report.xml
