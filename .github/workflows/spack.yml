name: Spack build test

# Builds the checkout with the local recipe and selected official releases
# with the official recipe, then smoke-tests installations except GPU-only builds.
#
# Sunday runs test the latest official spack-packages develop commit. PR checks
# use a pinned, known-good snapshot to avoid unrelated upstream regressions.
# Manual dispatch offers latest (default) or pinned. Resolve the commit once
# for the entire matrix and record it in job summaries and failure reports.
# Update the pin deliberately after reviewing successful scheduled runs.
#
# One Ubuntu/GCC development entry follows the contributor workflow: install
# only dependencies, generate CMake presets, build the release configuration,
# and run a tutorial simulation. Other entries test full Spack package builds;
# CUDA validates compilation and linking only because the runner has no GPU.
on:
  schedule:
    # Weekly, avoiding the top of the hour as recommended by GitHub
    - cron: "17 5 * * 0"
      timezone: "Europe/Berlin"
  workflow_dispatch:
    inputs:
      packages:
        description: "Official Spack packages: latest develop or known-good snapshot"
        type: choice
        options:
          - latest
          - pinned
        default: latest
  pull_request:
    paths:
      - ".github/workflows/spack.yml"
      - "dependencies/spack_repo/**"
      - "presets/spack/**"
      - "utilities/four_c_python/src/four_c_development/generate_spack_cmake_presets.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-packages:
    name: Resolve the Spack packages snapshot
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.packages.outputs.sha }}
    steps:
      - name: Select one commit for the entire matrix
        id: packages
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SELECTION: ${{ inputs.packages }}
          # Known-good official develop snapshot selected on 2026-11-12.
          # Advance deliberately after a successful weekly run; reassess the
          # CLN workaround and development dependency overrides at that time.
          PINNED_SHA: 8933fbb6925be105d493d2eff0c0b375a2ac1cc8
        run: |
          if [ "$EVENT" = schedule ] || { [ "$EVENT" = workflow_dispatch ] && [ "$SELECTION" = latest ]; }; then
            SHA=$(git ls-remote --exit-code https://github.com/spack/spack-packages.git refs/heads/develop | cut -f1)
            POLICY=latest
          else
            SHA="$PINNED_SHA"
            POLICY=pinned
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve a single Spack packages commit: $SHA" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "### Spack packages snapshot" >> "$GITHUB_STEP_SUMMARY"
          echo "- Policy: \`$POLICY\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: [\`$SHA\`](https://github.com/spack/spack-packages/commit/$SHA)" >> "$GITHUB_STEP_SUMMARY"

  spack-build:
    needs: select-packages
    name: Build and test 4C (${{ matrix.recipe }}, ${{ matrix.platform || matrix.os }}, ${{ matrix.compiler
      }}, ${{ matrix.variant }}, ${{ matrix.version }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # GCC 14 hits an internal compiler error on 4C's tensor templates.
          - recipe: release
            os: ubuntu-24.04
            compiler: gcc@13
            compiler_bin: /usr/bin/g++-13
            variant: minimal
            spec_args: ""
            version: "2026.2.0"
          - recipe: release
            os: ubuntu-24.04
            compiler: gcc@13
            compiler_bin: /usr/bin/g++-13
            variant: minimal
            spec_args: ""
            version: latest-release
          - recipe: release
            os: ubuntu-24.04
            compiler: gcc@13
            compiler_bin: /usr/bin/g++-13
            variant: extended
            spec_args: "+vtk +gmsh +mirco +arborx +fftw +backtrace"
            version: latest-release
          - recipe: release
            os: ubuntu-26.04
            compiler: gcc@15
            compiler_bin: /usr/bin/g++-15
            variant: minimal
            spec_args: ""
            version: latest-release
          - recipe: release
            os: ubuntu-26.04
            compiler: gcc@15
            compiler_bin: /usr/bin/g++-15
            variant: dealii
            spec_args: "+dealii"
            version: latest-release
          - recipe: development
            os: ubuntu-24.04
            compiler: gcc@13
            compiler_bin: /usr/bin/g++-13
            variant: minimal
            # Exercise the documented contributor path instead of installing 4C.
            dependencies_only: true
            spec_args: ""
            version: main
          - recipe: development
            os: ubuntu-26.04
            compiler: gcc@15
            compiler_bin: /usr/bin/g++-15
            variant: minimal
            spec_args: ""
            version: main
          - recipe: development
            os: ubuntu-26.04
            compiler: gcc@15
            compiler_bin: /usr/bin/g++-15
            variant: extended
            spec_args: "+vtk +gmsh +mirco +arborx +fftw +backtrace"
            version: main
          - recipe: development
            os: ubuntu-26.04
            compiler: gcc@15
            compiler_bin: /usr/bin/g++-15
            variant: dealii
            spec_args: "+dealii"
            version: main
          # These compilers/platforms need fixes not yet in the official recipe.
          - recipe: development
            os: ubuntu-24.04
            compiler: clang@18
            compiler_bin: /usr/bin/clang++-18
            variant: extended
            spec_args: "+vtk +gmsh +mirco +arborx +fftw +backtrace"
            version: main
          # Compile and link CUDA code without a GPU, matching the Docker CUDA build.
          - recipe: development
            os: ubuntu-24.04
            compiler: clang@18
            compiler_bin: /usr/bin/clang++-18
            variant: cuda
            spec_args: "+cuda cuda_arch=90"
            dependency_spec: "^cuda@12.8.1"
            version: main
          - recipe: development
            os: ubuntu-24.04
            compiler: oneapi@2025.3.2
            compiler_bin: /usr/bin/g++-13
            variant: extended
            spec_args: "+vtk +gmsh +mirco +arborx +fftw +backtrace"
            mpi_spec: "^intel-oneapi-mpi"
            version: main
          - recipe: development
            os: macos-26
            compiler: apple-clang@21.0.0
            compiler_bin: /usr/bin/clang++
            variant: minimal
            spec_args: ""
            version: main
          - recipe: development
            os: macos-26
            compiler: apple-clang@21.0.0
            compiler_bin: /usr/bin/clang++
            variant: extended
            spec_args: "+vtk +gmsh +mirco +arborx +fftw +backtrace"
            version: main
          - recipe: development
            os: ubuntu-24.04
            platform: rocky-10.2
            container: quay.io/rockylinux/rockylinux:10.2@sha256:827d37bc128288ccf160ee318bb3cb92d591164cb217e92f8bc61e3982ae1834
            compiler: gcc@16.1.0
            compiler_bin: /usr/bin/g++
            variant: extended
            spec_args: "+vtk +gmsh +mirco +arborx +fftw +backtrace"
            mpi_spec: "^openmpi"
            version: main
    steps:
      - name: Harden Runner
        if: ${{ !matrix.container }}
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Prepare Rocky Linux
        if: matrix.container
        run: |
          dnf install -y \
            gcc gcc-c++ gcc-gfortran git python3 python3-pip \
            make cmake pkgconf-pkg-config patch diffutils findutils tar gzip bzip2 xz unzip wget \
            which hostname file perl curl ca-certificates libxcrypt-compat
          cat /etc/os-release
          # Keep system tools reachable when composite actions extend the container PATH.
          printf '%s\n' /usr/local/sbin /usr/local/bin /usr/sbin /usr/bin /sbin /bin >> "$GITHUB_PATH"

      - name: Set up Spack
        uses: spack/setup-spack@16b756799ede8b28951287f89bcd3fdb32ec1ca3 # v3.0.0
        with:
          # Temporary development pin for spack/spack#53350 (cross-repository patches).
          spack_repository: ${{ matrix.recipe == 'development' && 'georghammerl/spack' || 'spack/spack'
            }}
          spack_ref: ${{ matrix.recipe == 'development' && '27b41ace7b09dfd95609b932466a282a52f6054a'
            || 'v1.2.2' }}
          packages_ref: ${{ needs.select-packages.outputs.sha }}
          buildcache: true
          color: true

      - name: Checkout 4C
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: 4C-src

      - name: Register the local development recipe
        if: matrix.recipe == 'development'
        run: |
          spack repo add "$GITHUB_WORKSPACE/4C-src/dependencies/spack_repo/fourc"
          spack repo list

      - name: Register only the CLN workaround for release builds
        if: matrix.recipe == 'release'
        run: |
          # CI-only overlay: keep the official 4C/ArborX recipes under test.
          # Remove when packages_ref includes the CLN archive and build-hook fixes.
          SOURCE_REPO="$GITHUB_WORKSPACE/4C-src/dependencies/spack_repo/fourc"
          CLN_REPO="$RUNNER_TEMP/cln-workaround/spack_repo/fourc"
          mkdir -p "$CLN_REPO/packages"
          cp "$SOURCE_REPO/repo.yaml" "$CLN_REPO/repo.yaml"
          cp -R "$SOURCE_REPO/packages/cln" "$CLN_REPO/packages/cln"
          spack repo add "$CLN_REPO"
          spack repo list

      - name: Find compilers
        run: |
          # Register only this one compiler: a broad `spack compiler find`
          # also picks up system clang/LLVM and registers it as an external
          # `libllvm`, which then breaks mesa (missing llvm-config).
          if [[ "${{ matrix.compiler }}" == clang@* ]]; then
            spack compiler find /usr/bin/g++-13
          fi
          spack compiler find ${{ matrix.compiler_bin }}

      - name: Install GCC 16.1 for Rocky Linux
        if: matrix.platform == 'rocky-10.2'
        run: |
          spack install --fail-fast --verbose "gcc@16.1.0 %gcc"
          spack compiler find "$(spack location --install-dir gcc@16.1.0)/bin"
          spack compiler info gcc@16.1.0

      - name: Isolate Android libraries from Intel MPI discovery
        if: startsWith(matrix.compiler, 'oneapi@')
        run: |
          if [ -d /usr/local/lib/android ]; then
            sudo mv /usr/local/lib/android /usr/local/android-sdk
          fi

      - name: Use runner GNU Make for Intel builds
        if: startsWith(matrix.compiler, 'oneapi@')
        run: spack external find --not-buildable --path /usr/bin gmake

      - name: Install Intel oneAPI compilers
        if: startsWith(matrix.compiler, 'oneapi@')
        env:
          COMPILER: ${{ matrix.compiler }}
        run: |
          # Cached dependencies may require GLIBCXX_3.4.32 (at least GCC 13).
          spack config add 'packages:gcc-runtime:require:"@13:"'
          spack install --fail-fast --verbose "intel-oneapi-compilers@${COMPILER#oneapi@} %gcc@13"
          spack compiler info "intel-oneapi-compilers@${COMPILER#oneapi@}"

      - name: Select the 4C version
        id: version
        env:
          RECIPE: ${{ matrix.recipe }}
          REQUESTED_VERSION: ${{ matrix.version }}
        run: |
          if [ "$RECIPE" = development ]; then
            VERSION=main
            PACKAGE=fourc.4c-multiphysics
          elif [ "$REQUESTED_VERSION" = latest-release ]; then
            # Tokenize Spack's column-aligned version table before filtering.
            VERSION=$(spack --color=never versions --safe builtin.4c-multiphysics \
              | tr -s '[:space:]' '\n' \
              | grep -E '^[0-9]{4}\.[0-9]+\.[0-9]+$' \
              | sort --version-sort --reverse | head -n1)
            if [ -z "$VERSION" ]; then
              echo "Could not determine the latest 4C release from Spack." >&2
              exit 1
            fi
            PACKAGE=builtin.4c-multiphysics
          else
            VERSION="$REQUESTED_VERSION"
            PACKAGE=builtin.4c-multiphysics
          fi
          echo "Selected 4C: $PACKAGE@$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ENVIRONMENT="$RUNNER_TEMP/4c-spack-env"
          if [ "${{ matrix.dependencies_only }}" = true ]; then
            ENVIRONMENT="$GITHUB_WORKSPACE/4C-src/.spack"
          fi
          spack env create --dir "$ENVIRONMENT"
          spack -e "$ENVIRONMENT" add "$PACKAGE@$VERSION ${{ matrix.spec_args }} %${{ matrix.compiler }} ${{ matrix.mpi_spec }} ${{ matrix.dependency_spec }}"
          if [ "$RECIPE" = development ] && [ "${{ matrix.dependencies_only }}" != true ]; then
            spack -e "$ENVIRONMENT" develop --no-clone --path "$GITHUB_WORKSPACE/4C-src" fourc.4c-multiphysics@main
          fi
          echo "SPACK_ENV=$ENVIRONMENT" >> "$GITHUB_ENV"
          echo "### Spack build test" >> "$GITHUB_STEP_SUMMARY"
          echo "- Spack packages: \`${{ needs.select-packages.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recipe: \`$RECIPE\` (\`$PACKAGE\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- OS: \`${{ matrix.platform || matrix.os }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compiler: \`${{ matrix.compiler }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Variant: \`${{ matrix.variant }}\` (\`${{ matrix.spec_args }}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- 4C version: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ matrix.dependencies_only }}" = true ]; then
            echo "- Validation: dependency-only installation and generated CMake release preset." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ matrix.variant }}" = cuda ]; then
            echo "- Validation: compile/link only; no GPU available for runtime tests." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$RECIPE" = development ]; then
            echo "- Checkout: \`$(git -C "$GITHUB_WORKSPACE/4C-src" rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Concretize and show the spec
        run: |
          # Release recipes also need LP64: cached ILP64 BLAS can link but crash
          # at runtime. Keep until the official 4C recipe enforces this ABI.
          spack config add 'packages:openblas:require:~ilp64'
          spack config add 'packages:intel-oneapi-mkl:require:~ilp64'
          spack concretize --deprecated
          spack spec -l

      - name: Verify the GNU runtime for Intel builds
        if: startsWith(matrix.compiler, 'oneapi@')
        run: |
          spack python -c 'exec("""
          import os
          import spack.environment as ev
          from spack.error import SpackError

          # Cached build tools may retain an older runtime independently of
          # the 4C libraries. Validate only the application link/run closure.
          runtimes = {
              node.dag_hash(): node
              for root in ev.Environment(os.environ["SPACK_ENV"]).concrete_roots()
              for node in root.traverse(deptype=("link", "run"))
              if node.name == "gcc-runtime"
          }
          if not runtimes:
              raise SpackError("Intel build has no link/run GCC runtime dependency")
          for runtime in runtimes.values():
              if not runtime.satisfies("@13:"):
                  raise SpackError(f"Intel build requires GCC runtime >=13, got {runtime}")
              print(f"Verified GNU runtime: {runtime}")
          """)'

      - name: Install 4C
        if: ${{ !matrix.dependencies_only }}
        run: |
          spack install --deprecated --fail-fast --verbose --use-buildcache package:never,dependencies:auto
          spack find --long --variants 4c-multiphysics

      - name: Install only the dependencies
        if: matrix.dependencies_only
        run: |
          spack install --only dependencies --deprecated --fail-fast --verbose \
            --use-buildcache package:never,dependencies:auto

      - name: Build the checkout using generated Spack presets
        if: matrix.dependencies_only
        shell: spack-bash {0}
        run: |
          cd "$GITHUB_WORKSPACE/4C-src"
          ./utilities/set_up_dev_env.sh
          ./utilities/python-venv/bin/generate-spack-cmake-presets
          # Use the installed build tools, but let the generated preset select
          # compilers and libraries exactly as in the contributor workflow.
          spack load cmake ninja
          cmake --list-presets
          cmake --fresh --preset spack-generated-release
          cmake --build build/spack-release --target 4C --parallel 2

      - name: Checkout tutorial input files matching the installed release
        if: matrix.recipe == 'release'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 4C-multiphysics/4C
          ref: v${{ steps.version.outputs.version }}
          sparse-checkout: |
            tests/tutorials/poisson
          sparse-checkout-cone-mode: false
          path: 4C-src

      - name: Smoke test - run 4C on a tutorial input file
        id: smoke-test
        if: matrix.variant != 'cuda'
        shell: spack-bash {0}
        env:
          OMPI_ALLOW_RUN_AS_ROOT: ${{ matrix.container && '1' || '0' }}
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: ${{ matrix.container && '1' || '0' }}
        run: |
          if [ "${{ matrix.dependencies_only }}" = true ]; then
            EXECUTABLE="$GITHUB_WORKSPACE/4C-src/build/spack-release/4C"
          else
            spack load 4c-multiphysics
            EXECUTABLE="$(command -v 4C)"
          fi
          echo "FOUR_C_EXECUTABLE=$EXECUTABLE" >> "$GITHUB_ENV"

          mkdir -p "$GITHUB_WORKSPACE/spack_smoke_test"
          cd "$GITHUB_WORKSPACE/spack_smoke_test"
          # 4C prints its version banner at the start of every run.
          "$EXECUTABLE" "$GITHUB_WORKSPACE/4C-src/tests/tutorials/poisson/tutorial_poisson_thermo.4C.yaml" spack_smoke_test_output

          # Verify output was actually produced, not just a zero exit code.
          if ! ls spack_smoke_test_output*.vtu >/dev/null 2>&1 && \
             ! ls spack_smoke_test_output*.pvd >/dev/null 2>&1; then
            echo "No output files were produced by the smoke test run." >&2
            exit 1
          fi

      - name: Capture a backtrace after a failed Linux smoke test
        if: failure() && steps.smoke-test.outcome == 'failure' && runner.os == 'Linux'
        shell: spack-bash {0}
        env:
          OMPI_ALLOW_RUN_AS_ROOT: ${{ matrix.container && '1' || '0' }}
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: ${{ matrix.container && '1' || '0' }}
        run: |
          if [ -n "${{ matrix.container }}" ]; then
            dnf install -y gdb
          else
            sudo apt-get update
            sudo apt-get install -y gdb
          fi
          if [ "${{ matrix.dependencies_only }}" != true ]; then
            spack load 4c-multiphysics
          fi
          mkdir -p "$GITHUB_WORKSPACE/spack_build_logs"
          cd "$GITHUB_WORKSPACE/spack_smoke_test"
          # Reproduce without hiding the original failure; retain all thread
          # stacks and loaded libraries in the existing failure artifact.
          gdb --batch --return-child-result \
            -ex run -ex "thread apply all bt" -ex "info sharedlibrary" \
            --args "$FOUR_C_EXECUTABLE" \
            "$GITHUB_WORKSPACE/4C-src/tests/tutorials/poisson/tutorial_poisson_thermo.4C.yaml" \
            spack_smoke_test_backtrace \
            > "$GITHUB_WORKSPACE/spack_build_logs/smoke-test-backtrace.log" 2>&1

      - name: Collect Spack build logs on failure
        if: failure()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/spack_build_logs"
          echo "${{ needs.select-packages.outputs.sha }}" > "$GITHUB_WORKSPACE/spack_build_logs/spack-packages-commit.txt"
          if [ "${{ matrix.dependencies_only }}" = true ]; then
            for file in spack.yaml spack.lock; do
              if [ -f "$SPACK_ENV/$file" ]; then
                cp "$SPACK_ENV/$file" "$GITHUB_WORKSPACE/spack_build_logs/"
              fi
            done
            BUILD_DIR="$GITHUB_WORKSPACE/4C-src/build/spack-release"
            for file in CMakeCache.txt CMakeFiles/CMakeConfigureLog.yaml; do
              if [ -f "$BUILD_DIR/$file" ]; then
                cp "$BUILD_DIR/$file" "$GITHUB_WORKSPACE/spack_build_logs/"
              fi
            done
          fi
          # Preserve relative stage paths without GNU-specific cp flags.
          STAGE_DIR="$(spack location --stages 2>/dev/null || true)"
          if [ -n "$STAGE_DIR" ] && [ -d "$STAGE_DIR" ]; then
            (
              cd "$STAGE_DIR"
              find . -type f \( -name "*.txt" -o -name "*.log" -o -name "spack-build-env*" \) -print0 |
                while IFS= read -r -d '' file; do
                  destination="$GITHUB_WORKSPACE/spack_build_logs/$file"
                  mkdir -p "$(dirname "$destination")"
                  cp "$file" "$destination"
                done
            )
          else
            echo "Spack stage directory not found; no build logs to collect." >&2
          fi
          spack debug report > "$GITHUB_WORKSPACE/spack_build_logs/spack_debug_report.txt" 2>&1 || true

      - name: Upload smoke test output
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spack_smoke_test_output-${{ matrix.recipe }}-${{ matrix.platform || matrix.os }}-${{ matrix.compiler
            }}-${{ matrix.variant }}-${{ matrix.version }}
          path: |
            ${{ github.workspace }}/spack_smoke_test
            ${{ github.workspace }}/spack_build_logs
          retention-days: 7

  report-failure:
    name: File an issue on failure
    needs: [select-packages, spack-build]
    # Only file issues for unattended (scheduled) runs
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - name: Report failure
        uses: ./.github/actions/report_nightly_test_failure
        with:
          title: "Scheduled Spack build test is failing"
          body: >
            The scheduled **Spack build test** workflow failed.

            Official spack-packages commit: `${{ needs.select-packages.outputs.sha }}`.
            Scheduled runs resolve the latest develop commit once for the entire matrix.

            This workflow builds the current checkout using the in-tree Spack recipe and the
            selected official 4C releases using the official
            [`4c-multiphysics` Spack package](https://packages.spack.io/package.html?name=4c-multiphysics).
            Both paths run across several OS/variant combinations and smoke-test the result,
            except for the CUDA build, which only compiles and links because the runner has no GPU.
            One Ubuntu/GCC development entry installs only dependencies, generates CMake presets,
            and builds the checkout through the documented contributor workflow.

            A failure here typically indicates one of:

            - The `4c-multiphysics` Spack package (or one of its dependencies) needs to be updated for
            the latest 4C release.

            - A regression in 4C's build system that only shows up outside of the in-repo Docker-based
            CI.

            - A transient upstream Spack/buildcache issue.
          labels: "github_actions,type: bug report"
