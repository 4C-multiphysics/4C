      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - uses: ./.github/actions/merge_junit_report_artifacts
        with:
          junit-report-base-name: gcc13_asan_test_report
          retention-days: 2
      - name: Report failure
        if: always() && needs.gcc13_asan_test.result != 'success'
        uses: ./.github/actions/report_nightly_test_failure
        with:
          title: "Nightly test failure: gcc13_asan"
          body: >
            The `gcc13_asan` nightly job failed. See the
            [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id
            }})
            for details.
          labels: "github_actions,type: bug report"

  clang18_performance_tests_build:
    # skip on forks to avoid wasted compute and LFS bandwidth usage
    if: github.repository == '4C-multiphysics/4C'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/4c-multiphysics/4c-dependencies-ubuntu24.04:f48156bf
      options: --user root --env OMPI_ALLOW_RUN_AS_ROOT=1 --env OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check docker hash
        uses: ./.github/actions/compute-and-check-dependencies-hash
      - uses: ./.github/actions/build_4C
        with:
          cmake-preset: docker_clang
          build-targets: full
          build-directory: ${{ github.workspace }}/build
          use-ccache: "false"
          additional-cmake-flags: >-
            -DFOUR_C_ENABLE_FULL_PERFORMANCE_TESTS=ON -DFOUR_C_PERFORMANCE_TESTS_COLLECTION_FILE=clang18_performance_tests_data.json
            -DFOUR_C_ENABLE_FULL_BENCHMARK_TESTS=ON  -DFOUR_C_BENCHMARK_TESTS_COLLECTION_FILE=clang18_benchmark_tests_data.json
      - uses: ./.github/actions/upload_directory
        name: Upload 4C build
        with:
          directory: ${{ github.workspace }}/build
          retention-days: 1
          name: clang18_performance_tests_build

  clang18_performance_tests_test:
    needs: clang18_performance_tests_build
    # skip on forks to reduce LFS bandwidth usage
    if: github.repository == '4C-multiphysics/4C'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/4c-multiphysics/4c-dependencies-ubuntu24.04:f48156bf
      options: --user root --env OMPI_ALLOW_RUN_AS_ROOT=1 --env OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git-lfs
        run: |
          apt-get update
          apt-get install -y git-lfs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # for performance tests, we need the large meshes, but we fetch them via a
          # cache below instead of downloading them from LFS on every nightly run
          lfs: false
      - name: Check docker hash
        uses: ./.github/actions/compute-and-check-dependencies-hash
      - name: Setup developer environment for testing
        run: |
          cd $GITHUB_WORKSPACE
          git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Cache LFS meshes
        id: lfs-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-meshes-${{ hashFiles('tests/performance_tests/meshes/full/**') }}
      - name: Pull LFS meshes
        run: git lfs pull
      - uses: ./.github/actions/download_directory
        with:
          name: clang18_performance_tests_build
          destination: ${{ github.workspace }}/build
      - name: Test
        run: |
          cd $GITHUB_WORKSPACE/build
          # Note: Do not run performance tests in parallel
          time ctest -L "performance_tests|benchmark_tests" --output-on-failure --output-junit $GITHUB_WORKSPACE/clang18_performance_tests_test_report.xml
      - name: Upload test report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: clang18_performance_tests_test_report.xml
          path: |
            ${{ github.workspace }}/clang18_performance_tests_test_report.xml
          retention-days: 1
      - name: Upload performance test data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: clang18_performance_tests_data.json
          path: |
            ${{ github.workspace }}/build/clang18_performance_tests_data.json
          retention-days: 30
      - name: Upload benchmark test data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: clang18_benchmark_tests_data.json
          path: |
            ${{ github.workspace }}/build/clang18_benchmark_tests_data.json
          retention-days: 30
