name: nightly_tests

on:
  schedule:
    # GitHub recommends avoiding scheduling at the start of the hour to avoid delays; thus, a random minute is set.
    - cron: "11 20 * * *"
      timezone: "Europe/Berlin"

jobs:
  gcc13_fourc_assertions_trilinos_assertions_build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/4c-multiphysics/4c-dependencies-ubuntu24.04-assertions:f48156bf
      options: --user root --env OMPI_ALLOW_RUN_AS_ROOT=1 --env OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
    defaults:
      run:
        shell: bash
    outputs:
      test-chunks: ${{ steps.set-matrix.outputs.chunk-array }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check docker hash
        uses: ./.github/actions/compute-and-check-dependencies-hash
      - uses: ./.github/actions/build_4C
        with:
          cmake-preset: docker_assertions
          build-targets: full
          build-directory: ${{ github.workspace }}/build
          use-ccache: "true"
      - uses: ./.github/actions/upload_directory
        name: Upload 4C build
        with:
          directory: ${{ github.workspace }}/build
          retention-days: 1
          name: gcc13_fourc_assertions_trilinos_assertions_build
      - uses: ./.github/actions/chunk_test_suite
        id: set-matrix
        with:
          build-directory: ${{ github.workspace }}/build
          source-directory: ${{ github.workspace }}
          number-of-chunks: 15
          junit-report-artifact-name: gcc13_fourc_assertions_trilinos_assertions_test_report.xml

  gcc13_fourc_assertions_trilinos_assertions_test:
    needs: gcc13_fourc_assertions_trilinos_assertions_build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/4c-multiphysics/4c-dependencies-ubuntu24.04-assertions:f48156bf
      options: --user root --env OMPI_ALLOW_RUN_AS_ROOT=1 --env OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
    strategy:
      fail-fast: false
      matrix:
        test-chunk: ${{fromJson(needs.gcc13_fourc_assertions_trilinos_assertions_build.outputs.test-chunks)}}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check docker hash
        uses: ./.github/actions/compute-and-check-dependencies-hash
      - name: Setup developer environment for testing
        run: |
          cd $GITHUB_WORKSPACE
          git config --global --add safe.directory $GITHUB_WORKSPACE
      - uses: ./.github/actions/download_directory
        with:
          name: gcc13_fourc_assertions_trilinos_assertions_build
          destination: ${{ github.workspace }}/build
      - name: Test
        run: |
          cd $GITHUB_WORKSPACE/build
          time ctest -I $TEST_CHUNK -j `nproc` --output-on-failure --output-junit $GITHUB_WORKSPACE/gcc13_fourc_assertions_trilinos_assertions_test_report-$TEST_CHUNK.xml
        env:
          TEST_CHUNK: ${{ matrix.test-chunk }}
      - name: Upload test report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: gcc13_fourc_assertions_trilinos_assertions_test_report-${{ matrix.test-chunk }}.xml
          path: |
            ${{ github.workspace }}/gcc13_fourc_assertions_trilinos_assertions_test_report-${{ matrix.test-chunk }}.xml
          retention-days: 7

  gcc13_fourc_assertions_trilinos_assertions_test_report:
    needs: gcc13_fourc_assertions_trilinos_assertions_test
    runs-on: ubuntu-latest
    if: success() || failure()
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - uses: ./.github/actions/merge_junit_report_artifacts
        with:
          junit-report-base-name: gcc13_fourc_assertions_trilinos_assertions_test_report
          retention-days: 2
      - name: Report failure
        if: always() && needs.gcc13_fourc_assertions_trilinos_assertions_test.result != 'success'
        uses: ./.github/actions/report_nightly_test_failure
        with:
          title: "Nightly test failure: gcc13_fourc_assertions_trilinos_assertions"
          body: >
            The `gcc13_fourc_assertions_trilinos_assertions` nightly job failed. See the
            [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id
            }})
            for details.
          labels: "github_actions,type: bug report"

  clang18_fourc_assertions_trilinos_assertions_build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/4c-multiphysics/4c-dependencies-ubuntu24.04-assertions:f48156bf
      options: --user root --env OMPI_ALLOW_RUN_AS_ROOT=1 --env OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
    defaults:
      run:
        shell: bash
    outputs:
      test-chunks: ${{ steps.set-matrix.outputs.chunk-array }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check docker hash
        uses: ./.github/actions/compute-and-check-dependencies-hash
      - uses: ./.github/actions/build_4C
        with:
          cmake-preset: docker_clang_assertions
          build-targets: full
          build-directory: ${{ github.workspace }}/build
          use-ccache: "false"
          additional-cmake-flags: "-DFOUR_C_CXX_FLAGS=-ftime-trace"
      - uses: ./.github/actions/analyze_compile_time_tracing
        with:
          build-directory: ${{ github.workspace }}/build
          aggregated-tracing-file: ${{ github.workspace }}/clang18_fourc_assertions_trilinos_assertions_build_trace.json
          report-summary-file: ${{ github.workspace }}/clang18_fourc_assertions_trilinos_assertions_compile_time_report.txt
          cleanup-individual-files: "true"
      - uses: ./.github/actions/upload_directory
        name: Upload 4C build
        with:
          directory: ${{ github.workspace }}/build
          retention-days: 1
          name: clang18_fourc_assertions_trilinos_assertions_build
      - name: Upload 4C schema
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.job }}-schema
          path: |
            ${{ github.workspace }}/build/4C_schema.json
          retention-days: 30
      - name: Upload 4C completion schema
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.job }}-completion-schema
          path: |
            ${{ github.workspace }}/build/4C_schema_completion.json
          retention-days: 30
      - name: Upload 4C metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.job }}-metadata
          path: |
            ${{ github.workspace }}/build/4C_metadata.yaml
          retention-days: 30
      - name: Upload compile time tracing summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.job }}-time-trace-summary
          path: |
            ${{ github.workspace }}/clang18_fourc_assertions_trilinos_assertions_compile_time_report.txt
      - name: Upload Compile time Trace
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.job }}-time-trace
          path: |
            ${{ github.workspace }}/clang18_fourc_assertions_trilinos_assertions_build_trace.json
          retention-days: 30
      - uses: ./.github/actions/chunk_test_suite
        id: set-matrix
        with:
          build-directory: ${{ github.workspace }}/build
          source-directory: ${{ github.workspace }}
          number-of-chunks: 15
          junit-report-artifact-name: clang18_fourc_assertions_trilinos_assertions_test_report.xml

  clang18_fourc_assertions_trilinos_assertions_compile_time_report:
    needs: clang18_fourc_assertions_trilinos_assertions_build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Catapult repo
        run: | # version from 2025-10-13
          git clone https://chromium.googlesource.com/catapult --depth 1
          cd catapult
          git fetch origin 2f71f97f0b2d6f885dbeac39a7460863b10a14c0 --depth 1
          git checkout FETCH_HEAD
      - name: Download aggregated ninja trace
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clang18_fourc_assertions_trilinos_assertions_build-time-trace
          path: ${{ github.workspace }}
      - name: Generate compile time trace for clang 18 assertions build
        run: |
          catapult/tracing/bin/trace2html $GITHUB_WORKSPACE/clang18_fourc_assertions_trilinos_assertions_build_trace.json --output=$GITHUB_WORKSPACE/clang18_fourc_assertions_trilinos_assertions_compile_time_report.html
      - name: Upload trace
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clang18_fourc_assertions_trilinos_assertions_compile_time_report
          path: |
            ${{ github.workspace }}/clang18_fourc_assertions_trilinos_assertions_compile_time_report.html
          retention-days: 90

