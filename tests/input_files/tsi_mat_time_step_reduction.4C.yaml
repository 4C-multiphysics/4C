TITLE:
  - "Single HEX8 with a thermo-viscoplastic material under uniaxial tension in monolithic TSI,"
  - "based on mat_iso_thermoviscoplast_refJC_log_timint_tsi_monolithic."
  - "The local Newton of the viscoplastic factor fails for too large time steps and requests a"
  - "time-step reduction (ALLOW_MATERIAL_TIME_STEP_REDUCTION)."
  - "Step 1: dt = 5e-5 (elastic) -> step succeeds"
  - "Step 2: dt = 5e-5"
  - "  -> request in the predictor -> dt = 2.5e-5"
  - "  -> request in the nonlinear solve -> dt = 1.25e-5"
  - "  -> step succeeds with dt = 1.25e-5"
  - "Step 3: dt = 1.25e-5 -> step succeeds -> increasing dt = 2.5e-5"
  - "Step 4: dt = 2.5e-5"
  - "  -> request in the nonlinear solve -> dt = 1.25e-5"
  - "  -> step succeeds with dt = 1.25e-5"
  - "Step 5: dt = 1.25e-5 -> step succeeds"
PROBLEM TYPE:
  PROBLEMTYPE: "Thermo_Structure_Interaction"
STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  TOLDISP: 1e-08
  NEGLECTINERTIA: true
  LINEAR_SOLVER: 1
  ALLOW_MATERIAL_TIME_STEP_REDUCTION: true
THERMAL DYNAMIC:
  DYNAMICTYPE: OneStepTheta
  INITIALFIELD: "field_by_function"
  INITFUNCNO: 2
  TOLTEMP: 1e-08
  NORM_TEMP: Abs
  TOLRES: 1e-06
  NORM_RESF: Abs
  NORMCOMBI_RESFTEMP: And
  ITERNORM: L2
  PREDICT: ConstTemp
  ADAPTCONV: false
  ADAPTCONV_BETTER: 0.1
  LUMPCAPA: false
  LINEAR_SOLVER: 1
TSI DYNAMIC:
  COUPALGO: tsi_monolithic
  MATCHINGGRID: true
  NUMSTEP: 1000
  MAXTIME: 0.0001 # [s]
  TIMESTEP: 5e-5 # [s]
  ITEMAX: 10
  ITEMIN: 0
  NORM_INC: Abs
TSI DYNAMIC/MONOLITHIC:
  LINEAR_SOLVER: 1
  MERGE_TSI_BLOCK_MATRIX: true
  TOLINC: 1e-08
  CONVTOL: 1e-08
  NORM_RESF: Abs
  time_step_control:
    steps_to_increase: 2
SOLVER 1:
  SOLVER: UMFPACK
MATERIALS:
  - MAT: 1
    MAT_MultiplicativeSplitDefgradElastHyper:
      NUMMATEL: 1
      MATIDSEL: [2]
      NUMFACINEL: 1
      INELDEFGRADFACIDS: [3]
      DENS: 7830e-12 # [t/mm^3 = N*s^2/mm^4]
      REF_TEMPERATURE: 293.0 # [K]
      THERMAL_EXPANSION_COEFFICIENT: 11e-6 # [1/K]
  - MAT: 2
    ELAST_CoupNeoHooke:
      YOUNG: 200000 # [N/mm^2]
      NUE: 0.29 # [-]
  - MAT: 3
    MAT_InelasticDefgradTransvIsotropElastViscoplast:
      VISCOPLAST_LAW_ID: 4
      TAYLOR_QUINNEY_COEFFICIENT: 0.85 # [-]
      FIBER_READER_ID: 5
      MAT_BEHAVIOR: "isotropic"
      TIME_INTEGRATION_HIST_VARS: logarithmic
      LOCAL_NEWTON:
        CONV_CHECK: residual_and_increment_ratio
        MAX_ITER: 100
        RES_TOL: 1e-8
        INCR_TOL: 1e-8
        MAX_EXCEEDANCE_FACT_RES_TOL: 10
        MAX_EXCEEDANCE_FACT_INCR_TOL: 10
        DIVER_CONT: stop_and_request_step_reduction
      ADAPTIVE_ESTIMATE_INTERPOLATION:
        USE_ADAPTIVE_ESTIMATE_INTERPOLATION: false
  - MAT: 4
    MAT_ViscoplasticLawReformulatedJohnsonCook:
      STRAIN_RATE_PREFAC: 1 # [1/s]
      STRAIN_RATE_EXP_FAC: 0.014 # [-]
      INIT_YIELD_STRENGTH: 792 # [N/mm^2]
      ISOTROP_HARDEN_PREFAC: 510 # [N/mm^2]
      ISOTROP_HARDEN_EXP: 0.26 # [-]
      REF_TEMPERATURE: 293.0 # [K]
      TEMPERATURE_SENS: 1.03 # [-]
      MELT_TEMPERATURE: 1793 # [K]
  - MAT: 5
    ELAST_CoupTransverselyIsotropic:
      ALPHA: 1
      BETA: 1
      GAMMA: 1
      ANGLE: 0
      STR_TENS_ID: 100
  - MAT: 100
    ELAST_StructuralTensor:
      STRATEGY: "Standard"

  - MAT: 10
    MAT_Fourier:
      CAPA: 3.734910 # [mJ/(mm^3*K) = N/(mm^2*K)]
      CONDUCT:
        constant: [37] # [mW/(mm*K) = N/s/K]

CLONING MATERIAL MAP:
  - SRC_FIELD: structure
    SRC_MAT: 1
    TAR_FIELD: thermo
    TAR_MAT: 10

FUNCT1:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "a"
  - VARIABLE: 0
    NAME: "a"
    TYPE: "multifunction"
    NUMPOINTS: 2
    TIMES: [0, 1.6e+16]
    DESCRIPTION: ["(exp(1.0e2*t)-1.0)"] # [mm]
FUNCT2:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "temperature_initial_field"
  - VARIABLE: 0
    TYPE: expression
    NAME: "temperature_initial_field"
    DESCRIPTION: "293"
RESULT DESCRIPTION:
  - STRUCTURE:
      SPECIAL: true
      QUANTITY: total_time
      VALUE: 0.0001
      TOLERANCE: 1e-15
  - STRUCTURE:
      SPECIAL: true
      QUANTITY: total_num_steps
      VALUE: 5
      TOLERANCE: 1e-16
  - STRUCTURE:
      SPECIAL: true
      QUANTITY: time_step_size
      VALUE: 1.25e-05
      TOLERANCE: 1e-16
  - STRUCTURE:
      DIS: "structure"
      NODE: 8
      QUANTITY: "dispx"
      VALUE: -0.00395149857637174407
      TOLERANCE: 1e-14
  - THERMAL:
      DIS: thermo
      NODE: 8
      QUANTITY: temp
      VALUE: 293.936120154136916
      TOLERANCE: 1e-10
