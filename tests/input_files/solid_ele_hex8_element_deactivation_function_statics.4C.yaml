TITLE:
  - "Element deactivation of a quasi-static hyperelastic cantilever"
  - "- the two outermost elements are deactivated at t=0.3 and t=0.6 by a function criterion"
  - "- the first element stays inactive after the function drops below the threshold at t=0.5"
  - "- the loads on deactivated elements (body force, surface traction) are removed"
  - "- the final state equals the one of a cantilever meshed without these two elements"
PROBLEM TYPE:
  PROBLEMTYPE: "Structure"
IO:
  STRUCT_STRESS: "Cauchy"
IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 1
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  DISPLACEMENT: true
  STRESS_STRAIN: true
SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Structure_Solver"
STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  RESTARTEVERY: 2
  TIMESTEP: 0.1
  NUMSTEP: 10
  MAXTIME: 1
  TOLDISP: 1e-10
  TOLRES: 1e-10
  LINEAR_SOLVER: 1
  element_erosion:
    erosion_function: 1
    threshold: 0.5
MATERIALS:
  - MAT: 1
    MAT_ElastHyper:
      NUMMAT: 1
      MATIDS: [10]
      DENS: 1
  - MAT: 10
    ELAST_CoupNeoHooke:
      YOUNG: 100
      NUE: 0.3
FUNCT1:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "heaviside(x-5)*(heaviside(t-0.25)-heaviside(t-0.45))+heaviside(x-4)*(1-heaviside(x-5))*heaviside(t-0.55)"
FUNCT2:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "t"
DESIGN SURF DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
DESIGN SURF NEUMANN CONDITIONS:
  - E: 2
    NUMDOF: 6
    ONOFF: [0, 0, 1, 0, 0, 0]
    VAL: [0, 0, -0.5, 0, 0, 0]
    FUNCT: [0, 0, 2, 0, 0, 0]
DESIGN VOL NEUMANN CONDITIONS:
  - E: 1
    NUMDOF: 6
    ONOFF: [0, 0, 1, 0, 0, 0]
    VAL: [0, 0, -0.2, 0, 0, 0]
    FUNCT: [0, 0, 2, 0, 0, 0]
