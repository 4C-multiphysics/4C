TITLE:
  - "Simulate a 2d qube to check, if the vtk runtime output works for"
  - "2D Wall elements"
PROBLEM SIZE:
  DIM: 2
PROBLEM TYPE:
  PROBLEMTYPE: "Structure"
IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 1
  OUTPUT_DATA_FORMAT: ascii
  OUTPUT_WRITER: vtu_per_rank
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  DISPLACEMENT: true
  STRESS_STRAIN: true
IO:
  STRUCT_STRESS: "Cauchy"
  STRUCT_STRAIN: GL
  VERBOSITY: "Standard"
STRUCTURAL DYNAMIC:
  TIMESTEP: 0.1
  NUMSTEP: 2
  MAXTIME: 0.2
  M_DAMP: 0
  K_DAMP: 0
  TOLRES: 1e-06
  MAXITER: 100
  PREDICT: "TangDis"
  LINEAR_SOLVER: 1
  RESTARTEVERY: 1
SOLVER 1:
  SOLVER: "Superlu"
  NAME: "Structure_Solver"
STRUCT NOX/Printing:
  Error: true
  Inner Iteration: false
  Details: true
  Linear Solver Details: true
  Test Details: true
MATERIALS:
  - MAT: 1
    MAT_Struct_StVenantKirchhoff:
      YOUNG: 1
      NUE: 0
      DENS: 1
DESIGN LINE NEUMANN CONDITIONS:
  - E: 2
    NUMDOF: 2
    ONOFF: [0, 1]
    VAL: [0, -2]
    FUNCT: [0, 0]
DESIGN LINE DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 2
    ONOFF: [1, 1]
    VAL: [0, 0]
    FUNCT: [0, 0]
  - E: 2
    NUMDOF: 2
    ONOFF: [1, 1]
    VAL: [0.05, 0.05]
    FUNCT: [0, 0]
