TITLE:
  - "15-step test case that tests that time-step increase is blocked by the average number of Newton iterations
    and the specified maximum time-step size:"
  - "  Step  1: dt=0.25, 4 Newton iterations, converged."
  - "  Step  2: dt=0.25, 3 Newton iterations, converged."
  - "  Step  3: dt=0.25, 3 Newton iterations, converged."
  - "    -> STEPS_TO_INCREASE: 3 is reached, but increase blocked by average Newton iterations over the
    last 3 steps (3.33 > 2)."
  - "  Step  4: dt=0.25, 3 Newton iterations, converged."
  - "    -> STEPS_TO_INCREASE: 3 is reached, but increase blocked by average Newton iterations over the
    last 3 steps (3 > 2)."
  - "  Step  5: dt=0.25, 2 Newton iterations, converged."
  - "    -> STEPS_TO_INCREASE: 3 is reached, but increase blocked by average Newton iterations over the
    last 3 steps (2.67 > 2)."
  - "  Step  6: dt=0.25, 2 Newton iterations, converged."
  - "    -> STEPS_TO_INCREASE: 3 is reached, but increase blocked by average Newton iterations over the
    last 3 steps (2.33 > 2)."
  - "  Step  7: dt=0.25, 2 Newton iterations, converged."
  - "    -> STEPS_TO_INCREASE: 3 is reached, AND average Newton iterations over the last 3 steps fulfilled
    (2 <= 2)."
  - "    -> dt increased to 0.25*2 = 0.5 for the next step."
  - "  Step  8: dt=0.5, 2 Newton iterations, converged."
  - "  Step  9: dt=0.5, 1 Newton iterations, converged."
  - "  Step 10: dt=0.5, 1 Newton iterations, converged."
  - "    -> STEPS_TO_INCREASE: 3 is reached, AND average Newton iterations over the last 3 steps fulfilled
    (1.63 <= 2)."
  - "    -> dt increased to MAX_TIME_STEP=0.6 for the next step, since 0.5*2=1.0 > MAX_TIME_STEP=0.6."
  - "  Step 11-15: dt=0.6, 1 Newton iterations, converged."
  - "    -> no further increase because MAX_TIME_STEP=0.6 is reached."
  - "  Final time-step size: dt=0.6, final time: t= 7*0.25 + 3*0.5 + 5*0.6 = 6.25"
PROBLEM TYPE:
  PROBLEMTYPE: "Structure"
STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  TIMESTEP: 0.25
  NUMSTEP: 15
  MAXTIME: 10
  TOLDISP: 1e-14
  TOLRES: 1e-14
  MAXITER: 5
  DIVERCONT: "adapt_step"
  LINEAR_SOLVER: 1
  TIMESTEP CONTROL:
    STEPS_TO_INCREASE: 3
    MAX_TIMESTEP: 0.6
    INCREASE_FACTOR: 2
    MAX_AVERAGE_NONLINEAR_ITERATIONS: 2
STRUCT NOX/Printing:
  Outer Iteration: false
  Outer Iteration StatusTest: false
  Inner Iteration: false
SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Structure_Solver"
MATERIALS:
  - MAT: 1
    MAT_ElastHyper:
      NUMMAT: 1
      MATIDS: [10]
      DENS: 0.1
  - MAT: 10
    ELAST_CoupNeoHooke:
      YOUNG: 10
      NUE: 0.25
FUNCT1:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "1.0-exp(-12.0*t)"
DESIGN SURF DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
DESIGN SURF NEUMANN CONDITIONS:
  - E: 2
    NUMDOF: 3
    ONOFF: [1, 0, 0]
    VAL: [0.01, 0, 0]
    FUNCT: [1, 0, 0]
DSURF-NODE TOPOLOGY:
  - "NODE 1 DSURFACE 1"
  - "NODE 2 DSURFACE 1"
  - "NODE 3 DSURFACE 1"
  - "NODE 4 DSURFACE 1"
  - "NODE 5 DSURFACE 2"
  - "NODE 6 DSURFACE 2"
  - "NODE 7 DSURFACE 2"
  - "NODE 8 DSURFACE 2"
NODE COORDS:
