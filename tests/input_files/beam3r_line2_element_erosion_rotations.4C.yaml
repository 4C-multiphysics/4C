TITLE:
  - "Rotational beam inertia after function-driven element erosion"
PROBLEM TYPE:
  PROBLEMTYPE: "Structure"
DISCRETISATION:
  NUMFLUIDDIS: 0
  NUMALEDIS: 0
  NUMTHERMDIS: 0
STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "GenAlphaLieGroup"
  TIMESTEP: 0.1
  NUMSTEP: 3
  MAXTIME: 0.3
  TOLDISP: 1e-10
  TOLRES: 1e-10
  MAXITER: 30
  MASSLIN: "rotations"
  LINEAR_SOLVER: 1
  element_erosion:
    erosion_function: 1
    threshold: 0.5
STRUCTURAL DYNAMIC/GENALPHA:
  RHO_INF: 0.95
SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Structure_Solver"
FUNCT1:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "heaviside(x-1.25)*heaviside(t-0.15)"
DESIGN POINT DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 6
    ONOFF: [1, 1, 1, 1, 1, 1]
    VAL: [0, 0, 0, 0, 0, 0]
    FUNCT: [0, 0, 0, 0, 0, 0]
DESIGN POINT NEUMANN CONDITIONS:
  - E: 2
    NUMDOF: 6
    ONOFF: [0, 0, 0, 0, 0, 1]
    VAL: [0, 0, 0, 0, 0, 0.1]
    FUNCT: [0, 0, 0, 0, 0, 0]
DNODE-NODE TOPOLOGY:
  - "NODE 1 DNODE 1"
  - "NODE 3 DNODE 2"
NODE COORDS:
  - "NODE 1 COORD 0 0 0"
  - "NODE 2 COORD 1 0 0"
  - "NODE 3 COORD 2 0 0"
STRUCTURE ELEMENTS:
  - "1 BEAM3R LINE2 1 2 MAT 1 TRIADS 0 0 0 0 0 0"
  - "2 BEAM3R LINE2 2 3 MAT 1 TRIADS 0 0 0 0 0 0"
MATERIALS:
  - MAT: 1
    MAT_BeamReissnerElastHyper:
      YOUNG: 100
      SHEARMOD: 50
      DENS: 1
      CROSSAREA: 0.1
      SHEARCORR: 1
      MOMINPOL: 0.001
      MOMIN2: 0.0005
      MOMIN3: 0.0005
RESULT DESCRIPTION:
  - STRUCTURE:
      DIS: "structure"
      NODE: 2
      QUANTITY: "dispy"
      VALUE: -0.15952624893179174
      TOLERANCE: 1e-8
