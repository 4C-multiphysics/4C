TITLE:
  - "Single HEX8 with GTN material under uniaxial tension."
  - "Same as the mat_gtn_single_hex8_time_step_constant.4C.yaml test,"
  - "but with a larger initial time-step size and ALLOW_MATERIAL_TIME_STEP_REDUCTION enabled."
  - "The mesh is partitioned such that all step reduction requests are rank-local."
  - "Step 1: dt = 5"
  - "  -> predictor fails -> dt = 2.5"
  - "  -> nonlinear solve fails -> dt = 1.25"
  - "  -> nonlinear solve fails -> dt = 0.625"
  - "  -> step succeeds with dt = 0.625"
  - "Step 2: dt = 0.625"
  - "  -> step succeeds with dt = 0.625"
  - "Step 3: dt = 1.25"
  - "  -> step succeeds with dt = 0.625"
  - "  -> increasing dt = 1.25"
  - "Step 4: dt = 1.25"
  - "  -> nonlinear solve fails -> dt = 0.625"
  - "  -> step succeeds with dt = 0.625"
  - "Step 5: dt = 0.625"
  - "  -> step succeeds with dt = 0.625"
  - "Step 6: dt = 0.625"
  - "  -> step succeeds with dt = 0.625"
  - "  -> increasing dt = 1.25"
  - "Step 7: dt = 1.25"
  - "  -> step succeeds with dt = 1.25"

PROBLEM TYPE:
  PROBLEMTYPE: "Structure"

# This forces the single element of this test to be completely owned by only one rank,
# while the other rank has zero elements. All step reduction requests are thus rank-local.
MESH PARTITIONING:
  MIN_ELE_PER_PROC: 1

STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  TIMESTEP: 5
  NUMSTEP: 10000
  MAXTIME: 5
  LINEAR_SOLVER: 1
  PREDICT: TangDis
  ALLOW_MATERIAL_TIME_STEP_REDUCTION: true
  time_step_control:
    steps_to_increase: 3

SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Structure_Solver"

MATERIALS:
  - MAT: 1
    MAT_Struct_PlasticGTN:
      YOUNG: 200000.0
      NUE: 0.3
      DENS: 7.85e-3
      YIELD: 450.0
      ISOHARD: 0.0
      HARDENING_FUNC: 1
      TOL: 1.0e-8
      MAXITER: 100
      F0: 0.005
      FN: 0.005
      EN: 0.15
      SN: 0.15
      FC: 1.0
      KAPPA: 4.0
      EF: 0.005
      K1: 1.5
      K2: 1.0
      K3: 2.25

FUNCT1:
  - VARFUNCTION: "450.0 + 300.0*(1.0 - exp(-15.0*epsp))"

FUNCT2:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "0.05*t"

RESULT DESCRIPTION:
  - STRUCTURE:
      SPECIAL: true
      QUANTITY: total_time
      VALUE: 5.0
      TOLERANCE: 1e-15
  - STRUCTURE:
      SPECIAL: true
      QUANTITY: total_num_steps
      VALUE: 7
      TOLERANCE: 1e-16
  - STRUCTURE:
      SPECIAL: true
      QUANTITY: time_step_size
      VALUE: 1.25
      TOLERANCE: 1e-16
  - STRUCTURE:
      DIS: "structure"
      NODE: 8
      QUANTITY: "reactz"
      VALUE: -182.430422395138407
      TOLERANCE: 1e-10

DESIGN SURF DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 0, 0]
    VAL: [0.0, 0.0, 0.0]
    FUNCT: [0, 0, 0]
  - E: 2
    NUMDOF: 3
    ONOFF: [0, 1, 0]
    VAL: [0.0, 0.0, 0.0]
    FUNCT: [0, 0, 0]
  - E: 3
    NUMDOF: 3
    ONOFF: [0, 0, 1]
    VAL: [0.0, 0.0, 0.0]
    FUNCT: [0, 0, 0]
  - E: 4
    NUMDOF: 3
    ONOFF: [0, 0, 1]
    VAL: [0.0, 0.0, 1]
    FUNCT: [0, 0, 2]

DSURF-NODE TOPOLOGY:
  - "NODE 1 DSURFACE 1"
  - "NODE 2 DSURFACE 1"
  - "NODE 3 DSURFACE 1"
  - "NODE 4 DSURFACE 1"
  - "NODE 1 DSURFACE 2"
  - "NODE 2 DSURFACE 2"
  - "NODE 5 DSURFACE 2"
  - "NODE 6 DSURFACE 2"
  - "NODE 2 DSURFACE 3"
  - "NODE 3 DSURFACE 3"
  - "NODE 6 DSURFACE 3"
  - "NODE 7 DSURFACE 3"
  - "NODE 1 DSURFACE 4"
  - "NODE 4 DSURFACE 4"
  - "NODE 5 DSURFACE 4"
  - "NODE 8 DSURFACE 4"

NODE COORDS:
  - "NODE 1 COORD 0.0 0.0 1.0"
  - "NODE 2 COORD 0.0 0.0 0.0"
  - "NODE 3 COORD 0.0 1.0 0.0"
  - "NODE 4 COORD 0.0 1.0 1.0"
  - "NODE 5 COORD 1.0 0.0 1.0"
  - "NODE 6 COORD 1.0 0.0 0.0"
  - "NODE 7 COORD 1.0 1.0 0.0"
  - "NODE 8 COORD 1.0 1.0 1.0"

STRUCTURE ELEMENTS:
  - "1 SOLID HEX8 1 2 3 4 5 6 7 8 MAT 1 KINEM linear"
