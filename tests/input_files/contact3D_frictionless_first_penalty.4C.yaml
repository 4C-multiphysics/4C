  - "NODE 10 COORD 2.01 0.0 1.01"
  - "NODE 11 COORD 2.01 1.0 1.01"
  - "NODE 12 COORD 1.01 1.0 1.01"
  - "NODE 13 COORD 1.01 0.0 2.01"
  - "NODE 14 COORD 2.01 0.0 2.01"
  - "NODE 15 COORD 2.01 1.0 2.01"
