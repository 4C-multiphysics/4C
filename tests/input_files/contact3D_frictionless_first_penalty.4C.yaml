TITLE:
  - "Penalty version of contact3D_frictionless_first_lagrange: Two diagonally separated HEX8 elements
    establish frictionless contact in the first step and slide with friction in the second step. Upon
    first contact, there are no old mortar mappings available. If the first step was not frictionless,
    this would fail."

PROBLEM TYPE:
  PROBLEMTYPE: "Structure"

IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 1
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  DISPLACEMENT: true
IO/MONITOR STRUCTURE DBC:
  INTERVAL_STEPS: 1

CONTACT DYNAMIC:
  LINEAR_SOLVER: 1
  FRICTION: "Coulomb"
  FRLESS_FIRST: true
  STRATEGY: "Penalty"
  PENALTYPARAM: 100000
  PENALTYPARAMTAN: 10000

MORTAR COUPLING:
  SEARCH_ALGORITHM: "BruteForce"
  SEARCH_PARAM: 1
  LM_SHAPEFCN: standard

MORTAR COUPLING/PARALLEL REDISTRIBUTION:
  PARALLEL_REDIST: "None"

STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  RESULTSEVERY: 1
  TIMESTEP: 1
  NUMSTEP: 2
  MAXTIME: 2
  MAXITER: 30
  TOLDISP: 1e-10
  TOLRES: 1e-10
  LINEAR_SOLVER: 1

SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Direct_Solver"

MATERIALS:
  - MAT: 1
    MAT_Struct_StVenantKirchhoff:
      YOUNG: 1000
      NUE: 0.3
      DENS: 0

FUNCT1:
  - COMPONENT: 0
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "a"
  - VARIABLE: 0
    NAME: "a"
    TYPE: "linearinterpolation"
    NUMPOINTS: 3
    TIMES: [0, 1, 2]
    VALUES: [0, 1, 2]

FUNCT2:
  - COMPONENT: 0
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "a"
  - VARIABLE: 0
    NAME: "a"
    TYPE: "linearinterpolation"
    NUMPOINTS: 3
    TIMES: [0, 1, 2]
    VALUES: [0, 0.06, 0.12]

DESIGN SURF DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
  - E: 4
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [-1, 0, -0.011]
    FUNCT: [2, 0, 1]
    TAG: monitor_reaction

DESIGN SURF MORTAR CONTACT CONDITIONS 3D:
  - E: 2
    InterfaceID: 1
    Side: "Slave"
    FrCoeffOrBound: 0.4
  - E: 3
    InterfaceID: 1
    Side: "Master"
    FrCoeffOrBound: 0.4

