TITLE:
  - "3 resistive airways forming a bifurcation, 2 attached terminal units."
  - "Both terminal units have linear elasticity, but they have differnt rheological models:"
  - "one is a 4-element maxwell model, the other a Kelvin-Voigt model."
  - "Tests if two different TU models work in parallel."
PROBLEM TYPE:
  PROBLEMTYPE: "Reduced_Lung"
reduced_dimensional_lung:
  air_properties:
    density: 1.176e-06
    dynamic_viscosity: 1.79105e-05
  dynamics:
    linear_solver: 1
    number_of_steps: 1
    restart_every: 1
    results_every: 1
    time_increment: 1
  geometry:
    file: "vtu/reduced_lung_3_aw_2_tu.vtu"
  lung_tree:
    airways:
      element_blocks: [1]
      radius:
        from_mesh: "radius"
      flow_model:
        resistance_type:
          constant: Linear
        include_inertia:
          constant: false
      wall_model_type:
        constant: Rigid
    terminal_units:
      element_blocks: [2]
      rheological_model:
        rheological_model_type:
          from_file: "reduced_lung_3_aw_2_tu_4elemax_and_kv.json"
        4_element_maxwell:
          elasticity_maxwell_e_m:
            constant: 1.0
          viscosity_maxwell_eta_m:
            constant: 0.1
          viscosity_kelvin_voigt_eta:
            constant: 0.01
        kelvin_voigt:
          viscosity_kelvin_voigt_eta:
            constant: 0.0
      elasticity_model:
        elasticity_model_type:
          constant: Linear
        linear:
          elasticity_e:
            constant: 1.0
  boundary_conditions:
    pressure:
      - id: 1
        function_id: 1
      - id: 2
        function_id: 2
SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Reduced_lung_solver"
FUNCT1:
  - SYMBOLIC_FUNCTION_OF_TIME: "t"
FUNCT2:
  - SYMBOLIC_FUNCTION_OF_TIME: "0"
