TITLE:
  - "Element deactivation of a bar with two fibers under tension"
  - "- quasi-static, small strain von Mises plasticity"
  - "- von Mises plasticity with Lemaitre damage, the weak fiber softens until its material"
  - "  fails (DAMCRIT) at a Gauss point, then the element is deactivated"
  - "- the node between them is fixed afterwards, the strong fiber carries the load"
