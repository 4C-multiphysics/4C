TITLE:
  - "3 resistive airways forming a bifurcation with given pressure bc."
  - "NewtonSparse runtime workflow variant."
PROBLEM TYPE:
  PROBLEMTYPE: "Reduced_Lung"
reduced_dimensional_lung:
  air_properties:
    density: 1.176e-06
    dynamic_viscosity: 1.79105e-05
  dynamics:
    linear_solver: 1
    nonlinear_solver: NewtonSparse
    number_of_steps: 1
    restart_every: 1
    results_every: 1
    time_increment: 1
  geometry:
    file: "vtu/reduced_lung_aw_bifurcation.vtu"
  lung_tree:
    airways:
      element_blocks: [1]
      radius:
        from_mesh: "radius"
      flow_model:
        resistance_type:
          constant: Linear
        include_inertia:
          constant: false
      wall_model_type:
        constant: Rigid
    terminal_units:
      v0:
        constant: 1.0
      rheological_model:
        rheological_model_type:
          constant: KelvinVoigt
        kelvin_voigt:
          viscosity_kelvin_voigt_eta:
            constant: 0.0
      elasticity_model:
        elasticity_model_type:
          constant: Linear
        linear:
          elasticity_e:
            constant: 1.0
  boundary_conditions:
    pressure:
      - id: 1
        function_id: 1
      - id: 2
        function_id: 2
SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Reduced_lung_solver"
FUNCT1:
  - SYMBOLIC_FUNCTION_OF_TIME: "t"
FUNCT2:
  - SYMBOLIC_FUNCTION_OF_TIME: "0"
RESULT DESCRIPTION:
  - REDUCED_LUNG:
      ELEMENT: 1
      QUANTITY: "q_in"
      VALUE: 33851.90503402932
      TOLERANCE: 1e-6
