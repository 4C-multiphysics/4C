TITLE:
  - "1 terminal unit with linear-pressure recruitment and exponential time law"
PROBLEM TYPE:
  PROBLEMTYPE: "Reduced_Lung"
reduced_dimensional_lung:
  air_properties:
    density: 1.176e-06
    dynamic_viscosity: 1.79105e-05
  dynamics:
    linear_solver: 1
    number_of_steps: 70
    restart_every: 1
    results_every: 1
    time_increment: 0.1
    output_verbosity: high
  geometry:
    file: "vtu/reduced_lung_terminal_unit.vtu"
  lung_tree:
    airways: # These values won't be used since there are no airways in the model
      radius:
        constant: 1.0
      flow_model:
        resistance_type:
          constant: Linear
        include_inertia:
          constant: false
      wall_model_type:
        constant: Rigid
    terminal_units:
      element_blocks: [2]
      rheological_model:
        rheological_model_type:
          constant: KelvinVoigt
        kelvin_voigt:
          viscosity_kelvin_voigt_eta:
            constant: 0.0
      elasticity_model:
        elasticity_model_type:
          constant: Linear
        linear:
          elasticity_e:
            constant: 1.0
      recruitment_model:
        pressure_law_type:
          constant: LinearPressure
        time_law_type:
          constant: ExponentialRelaxation
        reference_volume_linearization:
          constant: Frozen
        linear_pressure:
          v0_min:
            constant: 0.41
          v0_max:
            constant: 4.1887902047863905
          p_closing_min:
            constant: -0.1
          p_opening_min:
            constant: 0.8
          delta_p_minmax:
            constant: 0.4
          epsilon_v0_switch:
            constant: 0.05
          initial_v0:
            constant: 0.41
          initial_path:
            constant: Opening
        exponential_relaxation:
          tau:
            constant: 0.4
  boundary_conditions:
    pressure:
      - id: 1
        function_id: 1
      - id: 2
        function_id: 2
SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Reduced_lung_solver"
FUNCT1:
  - SYMBOLIC_FUNCTION_OF_TIME: "1*a"
  - VARIABLE: 0
    NAME: "a"
    TYPE: linearinterpolation
    NUMPOINTS: 5
    TIMES: [0.0, 1.5, 3.0, 5.0, 7.0]
    VALUES: [0.0, 1.5, 1.5, 0.0, 0.0]
FUNCT2:
  - SYMBOLIC_FUNCTION_OF_TIME: "0"
