TITLE:
  - "Similar to the mat_iso_viscoplast_refJC_log_timint.4C.yaml test, but with a larger initial"
  - "time-step size and ALLOW_MATERIAL_TIME_STEP_REDUCTION enabled."
  - "The mesh is partitioned such that all step reduction requests are rank-local."
  - "Step 1: dt = 1e-4"
  - "  -> predictor fails -> dt = 5e-5"
  - "  -> step succeeds with dt = 5e-5"
  - "Step 2: dt = 5e-5"
  - "  -> predictor fails -> dt = 2.5e-5"
  - "  -> nonlinear solve fails during 1st iteration -> dt = 1.25e-5"
  - "  -> step succeeds with dt = 1.25e-5"
  - "Step 3-5: dt = 1.25e-5"
  - "  -> step succeeds with dt = 1.25e-5"
PROBLEM TYPE:
  PROBLEMTYPE: "Structure"
# This forces the single element of this test to be completely owned by only one rank,
# while the other rank has zero elements. All step reduction requests are thus rank-local.
MESH PARTITIONING:
  MIN_ELE_PER_PROC: 1
IO:
  STRUCT_STRESS: "Cauchy"
  STRUCT_STRAIN: "LOG"
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  DISPLACEMENT: true
  STRESS_STRAIN: true
IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 1
STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  RESTARTEVERY: 30
  TIMESTEP: 1e-04
  NUMSTEP: 100000000
  MAXTIME: 0.0001
  TOLDISP: 1e-08
  NEGLECTINERTIA: true
  LINEAR_SOLVER: 1
  ALLOW_MATERIAL_TIME_STEP_REDUCTION: true
SOLVER 1:
  SOLVER: "UMFPACK"
MATERIALS:
  - MAT: 1
    MAT_MultiplicativeSplitDefgradElastHyper:
      NUMMATEL: 1
      MATIDSEL: [2]
      NUMFACINEL: 1
      INELDEFGRADFACIDS: [3]
      DENS: 7830
  - MAT: 2
    ELAST_CoupNeoHooke:
      YOUNG: 200000
      NUE: 0.29
  - MAT: 3
    MAT_InelasticDefgradTransvIsotropElastViscoplast:
      VISCOPLAST_LAW_ID: 4
      FIBER_READER_ID: 5
      MAT_BEHAVIOR: "isotropic"
      TIME_INTEGRATION_HIST_VARS: logarithmic
      LOCAL_NEWTON:
        CONV_CHECK: residual_and_increment_ratio
        MAX_ITER: 100
        RES_TOL: 1e-8
        INCR_TOL: 1e-8
        MAX_EXCEEDANCE_FACT_RES_TOL: 10
        MAX_EXCEEDANCE_FACT_INCR_TOL: 10
        DIVER_CONT: stop
      ERROR_REGISTRATION_SETTINGS:
        REGISTER_PLASTIC_STRAIN_INCR_OVERFLOW: true
        MAX_PLASTIC_STRAIN_INCR: 10686474581524.463
        REGISTER_PLASTIC_STRAIN_DERIV_INCR_OVERFLOW: false
        MAX_PLASTIC_STRAIN_DERIV_INCR: 10686474581524.463
      ADAPTIVE_ESTIMATE_INTERPOLATION:
        USE_ADAPTIVE_ESTIMATE_INTERPOLATION: false
  - MAT: 4
    MAT_ViscoplasticLawReformulatedJohnsonCook:
      STRAIN_RATE_PREFAC: 1
      STRAIN_RATE_EXP_FAC: 0.014
      INIT_YIELD_STRENGTH: 792
      ISOTROP_HARDEN_PREFAC: 510
      ISOTROP_HARDEN_EXP: 0.26
      REF_TEMPERATURE: 293.0
      TEMPERATURE_SENS: 1.03
      MELT_TEMPERATURE: 1000.0
  - MAT: 5
    ELAST_CoupTransverselyIsotropic:
      ALPHA: 1
      BETA: 1
      GAMMA: 1
      ANGLE: 0
      STR_TENS_ID: 100
  - MAT: 100
    ELAST_StructuralTensor:
      STRATEGY: "Standard"
FUNCT1:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "a"
  - VARIABLE: 0
    NAME: "a"
    TYPE: "multifunction"
    NUMPOINTS: 2
    TIMES: [0, 1.6e+16]
    DESCRIPTION: ["(exp(1.0e2*t)-1.0)"]
