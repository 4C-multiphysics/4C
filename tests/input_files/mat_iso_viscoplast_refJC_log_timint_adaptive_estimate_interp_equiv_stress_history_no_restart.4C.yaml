TITLE:
  - "Simulation of a viscoplastic HEX8 element under uniaxial tension with a constant strain rate of $1
    \\ \\mathrm{s}^{-1}$, as shown in Ana, Schmidt, Wall: Accelerating Local Newton--Raphson Schemes in
    Computational Plasticity / Viscoplasticity."
  - "The Adaptive Estimate Interpolation scheme is used for local time integration, in order to determine
    efficient initial and updated estimates (due to re-estimations) for the Local Newton--Raphson procedure."
  - "The accumulated plastic strain of the estimates is integrated according to its evolution equation,
    consistent with the interpolated elastic deformation gradient."
  - "The starting point of the adaptive estimate interpolation procedure for the next timestep is set
    using the solution equivalent stress, in relation to the elastic and plastic predictors (I_HIST variant
    in the paper)."
PROBLEM TYPE:
  PROBLEMTYPE: "Structure"
IO:
  STRUCT_STRESS: "Cauchy"
  STRUCT_STRAIN: "log"
  STDOUTEVERY: 1
  VERBOSITY: minimal
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  DISPLACEMENT: true
  STRESS_STRAIN: true
  GAUSS_POINT_DATA_OUTPUT_TYPE: gauss_points
IO/RUNTIME VTK OUTPUT:
  EVERY_ITERATION: false
  INTERVAL_STEPS: 1
STRUCTURAL DYNAMIC:
  INT_STRATEGY: "Standard"
  DYNAMICTYPE: "Statics"
  RESTARTEVERY: 1
  TIMESTEP: 1
  NUMSTEP: 5000000
  MAXTIME: 1.0
  TOLDISP: 1e-06
  NORM_DISP: Abs
  TOLRES: 1e-06
  NORM_RESF: Abs
  NEGLECTINERTIA: true
  LINEAR_SOLVER: 1
SOLVER 1:
  SOLVER: "UMFPACK"
FUNCT1:
  - COMPONENT: 0
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "a"
  - VARIABLE: 0
    NAME: "a"
    TYPE: "multifunction"
    NUMPOINTS: 2
    TIMES: [0.0, 1.6e+16]
    DESCRIPTION: ["exp(1.0 * t) - 1.0"]
MATERIALS:
  - MAT: 1
    MAT_MultiplicativeSplitDefgradElastHyper:
      NUMMATEL: 1
      MATIDSEL: [2]
      NUMFACINEL: 1
      INELDEFGRADFACIDS: [3]
      DENS: 7830
  - MAT: 2
    ELAST_CoupSVK:
      YOUNG: 2.0e5
      NUE: 0.29
  - MAT: 3
    MAT_InelasticDefgradTransvIsotropElastViscoplast:
      VISCOPLAST_LAW_ID: 4
      FIBER_READER_ID: 5
      MAT_BEHAVIOR: "isotropic"
      TIME_INTEGRATION_HIST_VARS: logarithmic
      LOCAL_NEWTON:
        CONV_CHECK: residual_and_increment_ratio
        MAX_ITER: 100
        RES_TOL: 1.0e-10
        INCR_TOL: 1.0e-10
        DIVER_CONT: stop
      ERROR_REGISTRATION_SETTINGS:
        MAX_PLASTIC_STRAIN_INCR: 1.0e12
      ADAPTIVE_ESTIMATE_INTERPOLATION:
        USE_ADAPTIVE_ESTIMATE_INTERPOLATION: true
        ELASTIC_PREDICTOR_ZERO_COMPONENT_THRESHOLD: 1e-13
        PLASTIC_PREDICTOR_CONSTRUCTION:
          ELASTIC_STRETCH_EIGENVAL_TYPE: scale_unit
          ELASTIC_STRETCH_EIGENVECT_TYPE: from_elastic_predictor
          ELASTIC_ROTATION_TYPE: from_elastic_predictor
          MAX_ITER: 50
          RELATIVE_UNDERSTRESS_TOL: 0.000001
          INTERVAL_SCANNING_PARAM: 0.5
        ESTIMATE_INTERPOLATION:
          STARTING_POINT_TYPE: equiv_stress_history
          MAX_ITER: 50
          INTERVAL_SCANNING_PARAM: 0.5
        HARDENING_MANAGEMENT:
          METHOD: integrate_via_evolution_equations
          MAX_ITER_INTEGRATION: 50
          TOL_INTEGRATION: 1e-8
        REESTIMATION:
          MAX_NUM_REESTIMATIONS: 10
          INTERVAL_SCANNING_PARAM: 0.5
  - MAT: 4
    MAT_ViscoplasticLawReformulatedJohnsonCook:
      STRAIN_RATE_PREFAC: 1
      STRAIN_RATE_EXP_FAC: 0.014
      INIT_YIELD_STRENGTH: 792.0
      ISOTROP_HARDEN_PREFAC: 510.0
      ISOTROP_HARDEN_EXP: 0.26
      REF_TEMPERATURE: 293
      MELT_TEMPERATURE: 1000
      TEMPERATURE_SENS: 0.1
  - MAT: 5
    ELAST_CoupTransverselyIsotropic:
      ALPHA: 1
      BETA: 1
      GAMMA: 1
      ANGLE: 0
      STR_TENS_ID: 100
  - MAT: 100
    ELAST_StructuralTensor:
      STRATEGY: "Standard"
