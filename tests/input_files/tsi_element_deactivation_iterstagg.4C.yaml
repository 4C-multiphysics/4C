TITLE:
  - "Element deactivation for iterstagg TSI"
  - "- bar heated on its top surface and clamped at x=0 (temperature and displacements)"
  - "- the element at the free end is deactivated at t=3 by a function criterion, its thermo"
  - "  element follows, the heat flux on its surface is removed"
  - "- nodes without active elements keep their displacements and temperatures"
PROBLEM TYPE:
  PROBLEMTYPE: "Thermo_Structure_Interaction"
IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 1
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  DISPLACEMENT: true
STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  TIMESTEP: 1
  MAXTIME: 5
  TOLDISP: 1e-10
  TOLRES: 1e-10
  LINEAR_SOLVER: 1
  element_erosion:
    erosion_function: 2
    threshold: 0.5
THERMAL DYNAMIC:
  DYNAMICTYPE: Statics
  TIMESTEP: 1
  NUMSTEP: 5
  TOLTEMP: 1e-10
  TOLRES: 1e-10
  LINEAR_SOLVER: 1
TSI DYNAMIC:
  COUPALGO: "tsi_iterstagg"
  NUMSTEP: 5
  MAXTIME: 5
  TIMESTEP: 1
  ITEMAX: 100
  RESTARTEVERY: 1
TSI DYNAMIC/PARTITIONED:
  CONVTOL: 1e-10
SOLVER 1:
  SOLVER: "UMFPACK"
MATERIALS:
  - MAT: 1
    MAT_Struct_ThermoStVenantK:
      YOUNGNUM: 1
      YOUNG: [21000]
      NUE: 0.3
      DENS: 1
      THEXPANS: 1.2e-05
      INITTEMP: 0
  - MAT: 2
    MAT_Fourier:
      CAPA: 3.297e+06
      CONDUCT:
        constant: [52]
CLONING MATERIAL MAP:
  - SRC_FIELD: "structure"
    SRC_MAT: 1
    TAR_FIELD: "thermo"
    TAR_MAT: 2
FUNCT1:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "t"
FUNCT2:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "heaviside(x-3)*heaviside(t-2.5)"
DESIGN SURF DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
