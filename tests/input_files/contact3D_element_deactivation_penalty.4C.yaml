TITLE:
  - "Element deactivation with mortar contact (penalty)"
  - "- a block is pressed onto another block by prescribed displacements"
  - "- at t=0.5 an element of the slave block is deactivated, its slave nodes lose contact"
  - "- at t=0.8 an element of the master block is deactivated, its master face is removed"
  - "  from contact evaluation"
PROBLEM TYPE:
  PROBLEMTYPE: "Structure"
IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 1
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  DISPLACEMENT: true
STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  RESTARTEVERY: 1
  TIMESTEP: 0.1
  NUMSTEP: 10
  MAXTIME: 1
  TOLDISP: 1e-10
  TOLRES: 1e-08
  LINEAR_SOLVER: 1
  element_erosion:
    erosion_function: 2
    threshold: 0.5
CONTACT DYNAMIC:
  LINEAR_SOLVER: 2
  STRATEGY: "Penalty"
  PENALTYPARAM: 100000
MORTAR COUPLING:
  LM_SHAPEFCN: "Standard"
  SEARCH_ALGORITHM: "BruteForce"
  SEARCH_PARAM: 0.3
SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Structure_Solver"
SOLVER 2:
  SOLVER: "UMFPACK"
  NAME: "Contact_Solver"
MATERIALS:
  - MAT: 1
    MAT_ElastHyper:
      NUMMAT: 1
      MATIDS: [2]
      DENS: 0.1
  - MAT: 2
    ELAST_CoupNeoHooke:
      YOUNG: 1000
      NUE: 0.3
FUNCT1:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "t"
FUNCT2:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "heaviside(x-2)*heaviside(z-1)*heaviside(t-0.45)+heaviside(1-x)*heaviside(1-z)*heaviside(t-0.75)"
DESIGN SURF DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
  - E: 2
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, 0, -0.05]
    FUNCT: [0, 0, 1]
DESIGN SURF MORTAR CONTACT CONDITIONS 3D:
  - E: 3
    InterfaceID: 1
    Side: "Slave"
  - E: 4
    InterfaceID: 1
    Side: "Master"
