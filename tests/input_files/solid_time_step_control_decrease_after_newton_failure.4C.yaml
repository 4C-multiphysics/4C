TITLE:
  - "2 step test case that tests that newton non-convergence triggers time-step reduction:"
  - "  Step 1: dt=0.5, 1 Newton solver not converged"
  - "     -> dt is reduced to 0.4*0.5=0.2 -> repeat step:"
  - "     -> Step 1: dt=0.2, 1 Newton iteration, converged."
  - "  Time step recovery: dt is increased to 2*0.2=0.4"
  - "  Step 2: dt=0.4, 1 Newton solver not converged"
  - "     -> dt is reduced to 0.4*0.4=0.16 -> repeat step:"
  - "     -> Step 2: dt=0.16, 1 Newton iteration, converged."
  - "  Simulation ends at t=0.36, with dt=0.16"
PROBLEM TYPE:
  PROBLEMTYPE: "Structure"
STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  TIMESTEP: 0.5
  NUMSTEP: 2
  MAXTIME: 2.5
  TOLDISP: 1e-03
  TOLRES: 3e-07
  MAXITER: 1
  DIVERCONT: "adapt_step"
  LINEAR_SOLVER: 1
  TIMESTEP CONTROL:
    DECREASE_FACTOR: 0.4
    STEPS_TO_INCREASE: 1
    INCREASE_FACTOR: 2
STRUCT NOX/Printing:
  Outer Iteration: false
  Outer Iteration StatusTest: false
  Inner Iteration: false
SOLVER 1:
  SOLVER: "UMFPACK"
MATERIALS:
  - MAT: 1
    MAT_ElastHyper:
      NUMMAT: 1
      MATIDS: [10]
      DENS: 0.1
  - MAT: 10
    ELAST_CoupNeoHooke:
      YOUNG: 10
      NUE: 0.25
FUNCT1:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "t"
DESIGN SURF DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
DESIGN SURF NEUMANN CONDITIONS:
  - E: 2
    NUMDOF: 3
    ONOFF: [1, 0, 0]
    VAL: [0.01, 0, 0]
    FUNCT: [1, 0, 0]
DSURF-NODE TOPOLOGY:
  - "NODE 1 DSURFACE 1"
  - "NODE 2 DSURFACE 1"
  - "NODE 3 DSURFACE 1"
  - "NODE 4 DSURFACE 1"
  - "NODE 5 DSURFACE 2"
  - "NODE 6 DSURFACE 2"
  - "NODE 7 DSURFACE 2"
  - "NODE 8 DSURFACE 2"
NODE COORDS:
  - "NODE 1 COORD 0.0 0.0 0.0"
  - "NODE 2 COORD 0.0 1.0 0.0"
  - "NODE 3 COORD 0.0 0.0 1.0"
  - "NODE 4 COORD 0.0 1.0 1.0"
  - "NODE 5 COORD 1.0 0.0 0.0"
  - "NODE 6 COORD 1.0 1.0 0.0"
  - "NODE 7 COORD 1.0 0.0 1.0"
  - "NODE 8 COORD 1.0 1.0 1.0"
STRUCTURE ELEMENTS:
  - "1 SOLID HEX8 1 5 6 2 3 7 8 4 MAT 1 KINEM nonlinear"
RESULT DESCRIPTION:
  - STRUCTURE:
      SPECIAL: true
      QUANTITY: "num_iter_step_1"
      VALUE: 1
      TOLERANCE: 1e-14
  - STRUCTURE:
      SPECIAL: true
      QUANTITY: "num_iter_step_2"
      VALUE: 1
      TOLERANCE: 1e-14
  - STRUCTURE:
      SPECIAL: true
      QUANTITY: "time_step_size"
      VALUE: 0.16
      TOLERANCE: 1e-14
  - STRUCTURE:
      SPECIAL: true
      QUANTITY: "total_time"
      VALUE: 0.36
      TOLERANCE: 1e-14
  - STRUCTURE:
      SPECIAL: true
      QUANTITY: "total_num_steps"
      VALUE: 2
      TOLERANCE: 1e-14
