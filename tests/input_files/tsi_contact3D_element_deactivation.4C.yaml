TITLE:
  - "Element deactivation with TSI contact (lagrange, heat transfer across the contact)"
  - "- an upper block is pressed onto a lower block and heated on its top surface"
  - "- at t=0.5 an element of the upper (slave) block is deactivated, its slave nodes lose contact"
  - "- at t=0.8 an element of the lower (master) block is deactivated, its master face is removed"
  - "  from the contact search"
  - "- nodes without active elements keep their displacements and temperatures"
PROBLEM TYPE:
  PROBLEMTYPE: "Thermo_Structure_Interaction"
IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 1
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  DISPLACEMENT: true
CONTACT DYNAMIC:
  LINEAR_SOLVER: 1
MORTAR COUPLING/PARALLEL REDISTRIBUTION:
  PARALLEL_REDIST: "None"
TSI CONTACT:
  HEATTRANSSLAVE: 10
  HEATTRANSMASTER: 10
STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  TIMESTEP: 0.1
  TOLDISP: 1e-08
  TOLRES: 1
  LINEAR_SOLVER: 1
  element_erosion:
    erosion_function: 3
    threshold: 0.5
THERMAL DYNAMIC:
  DYNAMICTYPE: Statics
  INITIALFIELD: "field_by_function"
  INITFUNCNO: 1
  TIMESTEP: 0.1
  NUMSTEP: 10
  MAXTIME: 1
  LINEAR_SOLVER: 1
TSI DYNAMIC:
  NUMSTEP: 10
  MAXTIME: 1
  TIMESTEP: 0.1
  RESTARTEVERY: 1
TSI DYNAMIC/MONOLITHIC:
  CONVTOL: 0.0001
  TOLINC: 1e-07
  NORMCOMBI_RESFINC: "Coupl_Or_Single"
  LINEAR_SOLVER: 1
  MERGE_TSI_BLOCK_MATRIX: true
SOLVER 1:
  SOLVER: "UMFPACK"
MATERIALS:
  - MAT: 1
    MAT_Struct_ThermoStVenantK:
      YOUNGNUM: 1
      YOUNG: [4000]
      NUE: 0.3
      DENS: 0
      THEXPANS: 1e-05
      INITTEMP: 20
  - MAT: 2
    MAT_Fourier:
      CAPA: 0
      CONDUCT:
        constant: [52]
CLONING MATERIAL MAP:
  - SRC_FIELD: "structure"
    SRC_MAT: 1
    TAR_FIELD: "thermo"
    TAR_MAT: 2
FUNCT1:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "20+z*10"
FUNCT2:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "t"
FUNCT3:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "heaviside(x-2)*heaviside(z-1)*heaviside(t-0.45)+heaviside(1-x)*heaviside(1-z)*heaviside(t-0.75)"
DESIGN SURF DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, 0, -0.02]
    FUNCT: [0, 0, 2]
  - E: 2
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
DESIGN SURF THERMO DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 1
    ONOFF: [1]
    VAL: [40]
    FUNCT: [0]
  - E: 2
    NUMDOF: 1
    ONOFF: [1]
    VAL: [20]
    FUNCT: [0]
DESIGN SURF MORTAR CONTACT CONDITIONS 3D:
  - E: 3
    InterfaceID: 1
    Side: "Slave"
    Initialization: "Active"
  - E: 4
    InterfaceID: 1
    Side: "Master"
