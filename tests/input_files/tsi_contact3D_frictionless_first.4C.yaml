TITLE:
  - "Two diagonally separated thermo-mechanical HEX8 elements establish frictionless contact in the first
    step and slide with frictional heating in the second step. The initial diagonal separation in the
    initial configuration and contact initiation in a single step is chosen such that upon first contact,
    there are no old mortar mappings available. If the first step was not frictionless, this would fail."

PROBLEM TYPE:
  PROBLEMTYPE: "Thermo_Structure_Interaction"

THERMAL DYNAMIC/RUNTIME VTK OUTPUT:
  OUTPUT_THERMO: true
  TEMPERATURE: true
IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 1
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  DISPLACEMENT: true
IO/MONITOR STRUCTURE DBC:
  INTERVAL_STEPS: 1

CONTACT DYNAMIC:
  LINEAR_SOLVER: 1
  FRICTION: "Coulomb"
  FRLESS_FIRST: true
  SEMI_SMOOTH_CN: 100
  SEMI_SMOOTH_CT: 100000

MORTAR COUPLING:
  SEARCH_ALGORITHM: "BruteForce"
  SEARCH_PARAM: 1

MORTAR COUPLING/PARALLEL REDISTRIBUTION:
  PARALLEL_REDIST: "None"

TSI CONTACT:
  HEATTRANSSLAVE: 10
  HEATTRANSMASTER: 10
  TEMP_REF: 20
  TEMP_DAMAGE: 120

STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  LINEAR_SOLVER: 1

THERMAL DYNAMIC:
  INITIALFIELD: "field_by_function"
  INITFUNCNO: 3
  LINEAR_SOLVER: 1

TSI DYNAMIC:
  RESULTSEVERY: 1
  NUMSTEP: 2
  MAXTIME: 2
  TIMESTEP: 1
  ITEMAX: 20

TSI DYNAMIC/MONOLITHIC:
  LINEAR_SOLVER: 1
  MERGE_TSI_BLOCK_MATRIX: true

SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Direct_Solver"

MATERIALS:
  - MAT: 1
    MAT_Struct_ThermoStVenantK:
      YOUNGNUM: 1
      YOUNG: [1000]
      NUE: 0.3
      DENS: 0
      THEXPANS: 0
      INITTEMP: 20
  - MAT: 2
    MAT_Fourier:
      CAPA: 1
      CONDUCT:
        constant: [0]

CLONING MATERIAL MAP:
  - SRC_FIELD: "structure"
    SRC_MAT: 1
    TAR_FIELD: "thermo"
    TAR_MAT: 2

FUNCT1:
  - COMPONENT: 0
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "a"
  - VARIABLE: 0
    NAME: "a"
    TYPE: "linearinterpolation"
    NUMPOINTS: 3
    TIMES: [0, 1, 2]
    VALUES: [0, 1, 2]

FUNCT2:
  - COMPONENT: 0
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "a"
  - VARIABLE: 0
    NAME: "a"
    TYPE: "linearinterpolation"
    NUMPOINTS: 3
    TIMES: [0, 1, 2]
    VALUES: [0, 0.06, 0.12]

FUNCT3:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "20"

DESIGN SURF DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
  - E: 4
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [-1, 0, -0.011]
    FUNCT: [2, 0, 1]
    TAG: monitor_reaction

DESIGN SURF MORTAR CONTACT CONDITIONS 3D:
  - E: 2
    InterfaceID: 1
    Side: "Slave"
    FrCoeffOrBound: 0.4
  - E: 3
    InterfaceID: 1
    Side: "Master"
    FrCoeffOrBound: 0.4

DSURF-NODE TOPOLOGY:
